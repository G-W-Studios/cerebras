<!-- @dsCard group="Spacing" viewport="700x150" name="Spacing scale" subtitle="8px base with fine sub-steps" -->
<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--bg);padding:24px;font-family:var(--font-mono)}
.row{display:flex;align-items:flex-end;gap:14px}
.cell{display:flex;flex-direction:column;align-items:center;gap:6px}
.bar{background:var(--orange);border-radius:1px}
.lab{font-size:10px;letter-spacing:var(--ls-mono);color:var(--grey-500)}</style></head>
<body>
  <div class="row" id="r"></div>
  <script>
    const steps=[["4",4],["8",8],["12",12],["16",16],["24",24],["32",32],["40",40],["48",48],["64",64]];
    document.getElementById('r').innerHTML=steps.map(([n,v])=>
      `<div class="cell"><div class="bar" style="width:${v}px;height:${v}px"></div><div class="lab">${n}</div></div>`).join('');
  </script>
</body></html>
