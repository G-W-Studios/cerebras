<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--bg);padding:16px}
.row{display:grid;grid-template-columns:1.6fr 1fr;grid-template-rows:auto auto;gap:10px}
.tile{border-radius:var(--radius-xs);overflow:hidden;background:#000;border:1px solid var(--border)}
.tile img{display:block;width:100%;height:100%;object-fit:cover}
.tall{grid-row:span 2}</style></head>
<body>
  <div class="row">
    <div class="tile" style="height:230px"><img src="../assets/mockups/desktop-hero.jpg" alt="Cerebras website on a laptop"></div>
    <div class="tile tall"><img src="../assets/mockups/event-signage.jpg" alt="Cerebras event signage" style="height:230px"></div>
    <div class="tile" style="height:120px"><img src="../assets/mockups/event-stage.jpg" alt="Cerebras keynote stage — This is big"></div>
  </div>
</body></html>
