<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--bg);font-family:var(--font-mono);padding:20px}
  .row{display:flex;gap:8px}
  .sw{flex:1;height:88px;border-radius:var(--radius-xs);display:flex;align-items:flex-end;padding:8px;box-sizing:border-box;border:1px solid var(--border)}
  .sw span{font-size:10px;letter-spacing:var(--ls-mono)}
</style></head>
<body>
  <div class="row">
    <div class="sw" style="background:var(--green)"><span style="color:var(--ink)">green</span></div>
    <div class="sw" style="background:var(--teal-300)"><span style="color:var(--ink)">teal-300</span></div>
    <div class="sw" style="background:var(--teal-900)"><span style="color:#fff">teal-900</span></div>
    <div class="sw" style="background:var(--purple-300)"><span style="color:var(--ink)">purple-300</span></div>
    <div class="sw" style="background:#FF985D"><span style="color:var(--ink)">peach</span></div>
    <div class="sw" style="background:var(--maroon-900)"><span style="color:#fff">maroon</span></div>
  </div>
</body></html>
