<!-- @dsCard group="Colors" viewport="700x150" name="Core neutrals" subtitle="Warm-grey ramp from ink to paper" -->
<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--bg);font-family:var(--font-mono);padding:20px}
  .row{display:flex;gap:0;border-radius:var(--radius-xs);overflow:hidden;border:1px solid var(--border)}
  .sw{flex:1;height:88px;display:flex;align-items:flex-end;padding:8px;box-sizing:border-box}
  .sw span{font-size:10px;letter-spacing:var(--ls-mono)}
</style></head>
<body>
  <div class="row">
    <div class="sw" style="background:var(--black)"><span style="color:#fff">000</span></div>
    <div class="sw" style="background:var(--ink)"><span style="color:#fff">ink</span></div>
    <div class="sw" style="background:var(--grey-700)"><span style="color:#fff">700</span></div>
    <div class="sw" style="background:var(--grey-500)"><span style="color:#fff">500</span></div>
    <div class="sw" style="background:var(--grey-400)"><span style="color:#fff">400</span></div>
    <div class="sw" style="background:var(--grey-300)"><span style="color:var(--ink)">300</span></div>
    <div class="sw" style="background:var(--grey-200)"><span style="color:var(--ink)">200</span></div>
    <div class="sw" style="background:var(--grey-100)"><span style="color:var(--ink)">100</span></div>
    <div class="sw" style="background:var(--white)"><span style="color:var(--ink)">white</span></div>
  </div>
</body></html>
