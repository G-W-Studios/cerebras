<!-- @dsCard group="Colors" viewport="700x150" name="Brand orange & paper" subtitle="The single accent + signature cream surfaces" -->
<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--bg);font-family:var(--font-mono);padding:20px;display:flex;flex-direction:column;gap:12px}
  .row{display:flex;gap:8px}
  .sw{flex:1;height:72px;border-radius:var(--radius-xs);display:flex;align-items:flex-end;padding:8px;box-sizing:border-box;border:1px solid var(--border)}
  .sw span{font-size:10px;letter-spacing:var(--ls-mono)}
</style></head>
<body>
  <div class="row">
    <div class="sw" style="background:var(--orange)"><span style="color:var(--ink)">orange · F15A29</span></div>
    <div class="sw" style="background:var(--orange-bright)"><span style="color:var(--ink)">bright · F74E11</span></div>
    <div class="sw" style="background:var(--orange-400)"><span style="color:var(--ink)">400 · FD962E</span></div>
    <div class="sw" style="background:var(--orange-100)"><span style="color:var(--ink)">100 · FFE8DF</span></div>
  </div>
  <div class="row">
    <div class="sw" style="background:var(--paper)"><span style="color:var(--ink)">paper · ECE8E4</span></div>
    <div class="sw" style="background:var(--paper-50)"><span style="color:var(--ink)">paper-50 · F7F5F2</span></div>
    <div class="sw" style="background:var(--paper-25)"><span style="color:var(--ink)">paper-25 · FBFAF9</span></div>
  </div>
</body></html>
