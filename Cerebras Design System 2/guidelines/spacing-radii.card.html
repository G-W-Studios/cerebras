<!-- @dsCard group="Spacing" viewport="700x150" name="Radii & shadows" subtitle="Sharp corners; restrained, warm shadows" -->
<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--bg);padding:24px;font-family:var(--font-mono);display:flex;gap:28px;align-items:center}
.cell{display:flex;flex-direction:column;align-items:center;gap:8px}
.box{width:72px;height:72px;background:var(--white);border:1px solid var(--border)}
.lab{font-size:10px;letter-spacing:var(--ls-mono);color:var(--grey-500)}</style></head>
<body>
  <div class="cell"><div class="box" style="border-radius:var(--radius-xs)"></div><div class="lab">2px</div></div>
  <div class="cell"><div class="box" style="border-radius:5px"></div><div class="lab">5px</div></div>
  <div class="cell"><div class="box" style="border:none;box-shadow:var(--shadow-sm)"></div><div class="lab">shadow-sm</div></div>
  <div class="cell"><div class="box" style="border:none;box-shadow:var(--shadow-md)"></div><div class="lab">shadow-md</div></div>
  <div class="cell"><div class="box" style="border:none;box-shadow:var(--shadow-orange)"></div><div class="lab">orange</div></div>
</body></html>
